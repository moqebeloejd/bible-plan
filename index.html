<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>NKJV Chronological Bible Plan</title>
<meta name="description" content="A family reading plan following the publisher’s chronology and Scripture blocks in the NKJV Chronological Study Bible." />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NKJV Bible Plan" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#f7f9ff;--ink-2:#ffffff;--olive:#234286;--olive-soft:#36599d;--vellum:#142052;--vellum-2:#eef3ff;--gold:#315eb9;--gold-deep:#182665;--clay:#a8325d;--faded:#5e6985;--line:rgba(24,38,101,.18);}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
  html,body,#root{height:100%;margin:0;background:var(--ink);}
  body{overscroll-behavior:none;}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--faded);font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;z-index:99;}
</style>
</head>
<body>
<div id="boot">Opening your reading plan…</div>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="cloud-config.js"></script>
<script src="vendor/supabase.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

let PLAN=null;
const PLAN_URL="./data/reading-plan-v3.json";

const EPOCH_NAMES={1:"Before the Patriarchs",2:"The Patriarchs, Israel's Ancestors",3:"The Rise of a Unified People",4:"From Tribes to a Nation",5:"The Fall of Two Nations",6:"Exile and Return",7:"Between the Two Testaments",8:"The Coming of the Messiah",9:"The Church Age"};
const EPOCH_ERAS={1:"Creation to 2000 B.C.",2:"2000 to 1500 B.C.",3:"1500 to 1200 B.C.",4:"1200 to 930 B.C.",5:"930 to 586 B.C.",6:"586 to 332 B.C.",7:"332 B.C. to A.D. 30",8:"6 B.C. to A.D. 30",9:"A.D. 30 to 100"};
// Older shared-device records are intentionally left untouched. The approved
// account-only model never assigns them to whichever family member signs in next.
const LEGACY_STORAGE_KEY="bible365-v2";
const LEGACY_V3_STORAGE_KEY="bible365-v3";
const ACCOUNT_STORAGE_PREFIX="bible_reader_state_v1_";
const DEFAULT_START="2026-08-30";
const DEFAULT_VERSION="NKJV";
const TEXT_SIZE_KEY="bible365-text-size";
const TEXT_SIZES=[["Standard",1],["Large",1.15],["Larger",1.3],["Largest",1.45]];
const THEMES=[["Light","light"],["Dark","dark"]];
const ACCENTS=[["Church blue","blue"],["Pink","pink"],["Purple","purple"],["Teal","teal"]];
const validTheme=v=>THEMES.some(x=>x[1]===v)?v:"light";
const validAccent=v=>ACCENTS.some(x=>x[1]===v)?v:"blue";
// Large is the default: the household reported the original sizing as too small.
const DEFAULT_TEXT_SIZE=1.15;
const readTextSize=()=>{try{const v=parseFloat(localStorage.getItem(TEXT_SIZE_KEY));return TEXT_SIZES.some(t=>t[1]===v)?v:DEFAULT_TEXT_SIZE;}catch(e){return DEFAULT_TEXT_SIZE;}};
const applyTextSize=v=>{document.documentElement.style.setProperty("--fs",String(v));};
const applyAppearance=(theme,accent)=>{
  theme=validTheme(theme);accent=validAccent(accent);
  document.documentElement.dataset.theme=theme;document.documentElement.dataset.accent=accent;
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",theme==="dark"?"#101d55":"#ffffff");
};
const VERSION_OPTIONS=["NKJV","KJV","ESV","NIV","NLT","NASB","NRSVUE","CSB","NET","AMP"];
const CLOUD_CONFIG=window.BIBLE_CLOUD||{};
const CLOUD_CLIENT=window.supabase&&CLOUD_CONFIG.url&&CLOUD_CONFIG.publishableKey
  ? window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})
  : null;
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);

// --- reading nights -------------------------------------------------------
// The plan is an ordered list of sittings, not a run of consecutive days.
// Day N falls on the Nth reading night on or after the start date, so Friday
// and Saturday nights are skipped and the start date stays adjustable.
// Mirrors pilot/lib/project-dates.mjs: a day_id must mean the same on both sides.
const readingNights=()=>{const w=PLAN&&PLAN.schedule_policy&&PLAN.schedule_policy.reading_weekdays;return Array.isArray(w)&&w.length?w:[0,1,2,3,4];};
const isReadingNight=d=>readingNights().indexOf(d.getDay())>=0;
const firstNightOnOrAfter=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());let g=0;while(!isReadingNight(x)&&g++<14)x.setDate(x.getDate()+1);return x;};
const dateForPlanDay=(n,startDate)=>{const x=firstNightOnOrAfter(startDate);for(let i=1;i<n;i++){do{x.setDate(x.getDate()+1);}while(!isReadingNight(x));}return x;};
// How many reading nights have begun by `today`, counting the start night as 1.
const planDayForDate=(today,startDate)=>{
  const first=firstNightOnOrAfter(startDate);
  if(diffDays(today,first)<0)return 0;
  let n=0;const x=new Date(first.getFullYear(),first.getMonth(),first.getDate());
  while(diffDays(today,x)>=0){n++;do{x.setDate(x.getDate()+1);}while(!isReadingNight(x));}
  return n;
};
const planDayCount=()=>(PLAN&&PLAN.day_count)||244;
// A "week" is the household's run of reading nights, not seven calendar days.
const nightsPerWeek=()=>readingNights().length||5;
const weekCount=()=>Math.ceil(planDayCount()/nightsPerWeek());
const dayIdPrefix=()=>{const id=PLAN&&PLAN.days&&PLAN.days[0]&&PLAN.days[0].day_id;const m=id&&id.match(/^(.*-D)\d+$/);return m?m[1]:"CRP3-D";};
const dayIdFor=n=>`${dayIdPrefix()}${String(n).padStart(3,"0")}`;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtLong=d=>`${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
const epochNums=d=>(d.epochs||[]).map(x=>Number((x.match(/Epoch\s+(\d+)/)||[])[1])).filter(Boolean);
const epochSpans=()=>{const c={};PLAN.days.forEach(d=>{const e=epochNums(d)[0]||1;c[e]=(c[e]||0)+1;});return Object.keys(c).map(k=>({e:+k,n:c[k]}));};
const accountStorageKey=uid=>ACCOUNT_STORAGE_PREFIX+uid;
const writeLocal=(state,uid)=>{if(!uid)return;localStorage.setItem(accountStorageKey(uid),JSON.stringify({
  planId:PLAN.plan_id,start:state.start,bibleVersion:state.bibleVersion,done:[...state.done].sort((a,b)=>a-b),
  theme:validTheme(state.theme),accent:validAccent(state.accent),pending:state.pending||{},settingsPending:!!state.settingsPending
}));};

function loadAccountState(uid){
  try{
    const current=localStorage.getItem(accountStorageKey(uid));
    if(current){const s=JSON.parse(current);return {start:s.start||DEFAULT_START,bibleVersion:s.bibleVersion||DEFAULT_VERSION,theme:validTheme(s.theme),accent:validAccent(s.accent),done:new Set(Array.isArray(s.done)?s.done:[]),pending:s.pending||{},settingsPending:!!s.settingsPending};}
  }catch(e){}
  return {start:DEFAULT_START,bibleVersion:DEFAULT_VERSION,theme:"light",accent:"blue",done:new Set(),pending:{},settingsPending:false};
}

const readerName=(user,profileName="")=>profileName||user?.user_metadata?.display_name||user?.email?.split("@")[0]||"Reader";

function App(){
  const [start,setStart]=useState(DEFAULT_START);
  const [bibleVersion,setBibleVersion]=useState(DEFAULT_VERSION);
  const [theme,setTheme]=useState("light");
  const [accent,setAccent]=useState("blue");
  const [done,setDone]=useState(new Set());
  const [pending,setPending]=useState({});
  const [settingsPending,setSettingsPending]=useState(false);
  const [session,setSession]=useState(null);
  const [syncStatus,setSyncStatus]=useState(CLOUD_CLIENT?"Sign in to sync":"Local only");
  const [cloudBusy,setCloudBusy]=useState(false);
  const [accountUserId,setAccountUserId]=useState(null);
  const [readerDisplayName,setReaderDisplayName]=useState("");
  const [loaded,setLoaded]=useState(false);
  const [loadError,setLoadError]=useState(null);
  const [tab,setTab]=useState("today");
  const [viewDay,setViewDay]=useState(null);
  const [weekIdx,setWeekIdx]=useState(null);
  const [monthCursor,setMonthCursor]=useState(null);
  const [sealing,setSealing]=useState(false);
  const [confirmReset,setConfirmReset]=useState(false);
  const [textSize,setTextSize]=useState(readTextSize);
  const [toast,setToast]=useState(null);
  const stateRef=useRef({start,bibleVersion,theme,accent,done,pending,settingsPending});
  const hydratedUserRef=useRef(null);
  const activeUserRef=useRef(null);
  activeUserRef.current=session?.user?.id||null;

  useEffect(()=>{applyTextSize(textSize);},[textSize]);
  useEffect(()=>{applyAppearance(theme,accent);},[theme,accent]);
  useEffect(()=>{stateRef.current={start,bibleVersion,theme,accent,done,pending,settingsPending};},[start,bibleVersion,theme,accent,done,pending,settingsPending]);

  const today=new Date();
  const startDate=parseISO(start);
  const todayPlanDay=planDayForDate(today,startDate);
  const currentDay=Math.min(Math.max(todayPlanDay,1),planDayCount());

  useEffect(()=>{
    let cancelled=false,subscription;
    (async()=>{
      try{
        const res=await fetch(PLAN_URL,{cache:"no-cache"});if(!res.ok)throw new Error("Reading plan could not be loaded.");
        const plan=await res.json();if(!plan.day_count||plan.days?.length!==plan.day_count)throw new Error("Reading plan failed its day-count check.");
        PLAN=plan;
        if(cancelled)return;
        if(CLOUD_CLIENT){
          try{
            const {data}=await CLOUD_CLIENT.auth.getSession();if(!cancelled)setSession(data.session||null);
            subscription=CLOUD_CLIENT.auth.onAuthStateChange((_event,next)=>setSession(next)).data.subscription;
          }catch(e){if(!cancelled)setSyncStatus("Offline — local progress is available");}
        }
        setLoaded(true);const b=document.getElementById("boot");if(b)b.remove();
      }catch(err){setLoadError(err.message||"Unable to open the reading plan.");const b=document.getElementById("boot");if(b)b.textContent=err.message||"Unable to open the reading plan.";}
    })();
    return()=>{cancelled=true;subscription?.unsubscribe();};
  },[]);

  useEffect(()=>{
    const uid=session?.user?.id;
    if(!uid){setAccountUserId(null);hydratedUserRef.current=null;return;}
    const local=loadAccountState(uid);
    setStart(local.start);setBibleVersion(local.bibleVersion);setTheme(local.theme);setAccent(local.accent);setDone(local.done);setPending(local.pending);setSettingsPending(local.settingsPending);applyAppearance(local.theme,local.accent);
    setReaderDisplayName(readerName(session.user));stateRef.current=local;hydratedUserRef.current=null;setAccountUserId(uid);void provisionProfile(session.user);
  },[session?.user?.id]);

  const saveState=useCallback((next)=>{try{writeLocal(next,session?.user?.id);}catch(e){setToast("Couldn't save — progress is held for this session");}},[session?.user?.id]);

  const syncCloud=useCallback(async()=>{
    if(!CLOUD_CLIENT||!session?.user||!PLAN)return;
    const uid=session.user.id,s=stateRef.current;
    setSyncStatus(navigator.onLine?"Syncing…":"Offline — changes queued");if(!navigator.onLine)return;
    try{
      const operations={...s.pending};
      const completeIds=Object.keys(operations).filter(k=>operations[k]==="complete");
      const incompleteIds=Object.keys(operations).filter(k=>operations[k]==="incomplete");
      if(completeIds.length){const now=new Date().toISOString();const rows=completeIds.map(day=>({user_id:uid,plan_id:PLAN.plan_id,day_id:dayIdFor(day),completed_at:now,updated_at:now}));const {error}=await CLOUD_CLIENT.from("bible_reader_progress").upsert(rows,{onConflict:"user_id,plan_id,day_id"});if(error)throw error;}
      if(incompleteIds.length){const ids=incompleteIds.map(day=>dayIdFor(day));const {error}=await CLOUD_CLIENT.from("bible_reader_progress").delete().eq("user_id",uid).eq("plan_id",PLAN.plan_id).in("day_id",ids);if(error)throw error;}
      if(s.settingsPending){const {error}=await CLOUD_CLIENT.from("bible_reader_settings").upsert({user_id:uid,plan_id:PLAN.plan_id,start_date:s.start,bible_version:s.bibleVersion,theme:validTheme(s.theme),accent:validAccent(s.accent),updated_at:new Date().toISOString()},{onConflict:"user_id,plan_id"});if(error)throw error;}
      const [{data:cloudRows,error:progressError},{data:cloudSettings,error:settingsError}]=await Promise.all([
        CLOUD_CLIENT.from("bible_reader_progress").select("day_id").eq("user_id",uid).eq("plan_id",PLAN.plan_id),
        CLOUD_CLIENT.from("bible_reader_settings").select("start_date,bible_version,theme,accent").eq("user_id",uid).eq("plan_id",PLAN.plan_id).maybeSingle()
      ]);if(progressError)throw progressError;if(settingsError)throw settingsError;
      if(activeUserRef.current!==uid)return;
      const cloudDone=new Set((cloudRows||[]).map(r=>Number(r.day_id.slice(-3))));
      const latest=stateRef.current,remaining={...latest.pending};Object.entries(operations).forEach(([k,v])=>{if(remaining[k]===v)delete remaining[k];});
      Object.entries(remaining).forEach(([k,v])=>v==="complete"?cloudDone.add(Number(k)):cloudDone.delete(Number(k)));
      const nextStart=cloudSettings?.start_date||latest.start,nextVersion=cloudSettings?.bible_version||latest.bibleVersion,nextTheme=validTheme(cloudSettings?.theme||latest.theme),nextAccent=validAccent(cloudSettings?.accent||latest.accent);
      setDone(cloudDone);setPending(remaining);setStart(nextStart);setBibleVersion(nextVersion);setTheme(nextTheme);setAccent(nextAccent);setSettingsPending(false);
      saveState({start:nextStart,bibleVersion:nextVersion,theme:nextTheme,accent:nextAccent,done:cloudDone,pending:remaining,settingsPending:false});setSyncStatus("Synced");
    }catch(err){console.error(err);if(activeUserRef.current===uid)setSyncStatus("Offline — changes queued");}
  },[session,saveState]);

  useEffect(()=>{if(!loaded||accountUserId!==session?.user?.id)return;const uid=session.user.id,needsSync=hydratedUserRef.current!==uid||settingsPending||Object.keys(pending).length>0;if(!needsSync)return;hydratedUserRef.current=uid;const t=setTimeout(syncCloud,250);return()=>clearTimeout(t);},[loaded,accountUserId,session,pending,settingsPending,syncCloud]);
  useEffect(()=>{const onOnline=()=>syncCloud();const onFocus=()=>syncCloud();window.addEventListener("online",onOnline);window.addEventListener("focus",onFocus);return()=>{window.removeEventListener("online",onOnline);window.removeEventListener("focus",onFocus);};},[syncCloud]);

  const toggleDay=(n,withSeal)=>{const next=new Set(done),marking=!next.has(n);marking?next.add(n):next.delete(n);const nextPending={...pending,[n]:marking?"complete":"incomplete"};setDone(next);setPending(nextPending);saveState({start,bibleVersion,theme,accent,done:next,pending:nextPending,settingsPending});if(marking&&withSeal){setSealing(true);setTimeout(()=>setSealing(false),700);}};
  const changeSettings=(nextStart,nextVersion)=>{setStart(nextStart);setBibleVersion(nextVersion);setSettingsPending(true);saveState({start:nextStart,bibleVersion:nextVersion,theme,accent,done,pending,settingsPending:true});};
  const changeAppearance=(nextTheme,nextAccent)=>{nextTheme=validTheme(nextTheme);nextAccent=validAccent(nextAccent);setTheme(nextTheme);setAccent(nextAccent);applyAppearance(nextTheme,nextAccent);setSettingsPending(true);saveState({start,bibleVersion,theme:nextTheme,accent:nextAccent,done,pending,settingsPending:true});};
  const provisionProfile=async user=>{
    if(!CLOUD_CLIENT||!user||!navigator.onLine)return;
    const {data:existing,error:readError}=await CLOUD_CLIENT.from("reader_profiles").select("display_name").eq("user_id",user.id).maybeSingle();
    if(readError){console.warn("Reader profile could not be read.",readError);return;}
    const metadataName=String(user.user_metadata?.display_name||"").trim();
    const displayName=metadataName||existing?.display_name||readerName(user);
    if(!existing||metadataName&&metadataName!==existing.display_name){const {error}=await CLOUD_CLIENT.from("reader_profiles").upsert({user_id:user.id,display_name:displayName,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error){console.warn("Reader profile could not be refreshed.",error);return;}}
    if(activeUserRef.current===user.id)setReaderDisplayName(displayName);
  };
  const authenticate=async(mode,email,password,displayName)=>{if(!CLOUD_CLIENT)return;setCloudBusy(true);try{
    const normalizedEmail=String(email||"").trim();
    const options={email:normalizedEmail,password:String(password||"")};
    if(mode==="signup")options.options={data:{display_name:String(displayName||"").trim()||normalizedEmail.split("@")[0]},emailRedirectTo:location.origin+location.pathname};
    const {data,error}=mode==="signup"?await CLOUD_CLIENT.auth.signUp(options):await CLOUD_CLIENT.auth.signInWithPassword(options);if(error)throw error;
    if(mode==="signup"&&!data.session)setToast("Account created — check your email to confirm it");
    else {setSession(data.session);setToast("Welcome — your reading plan is opening");void provisionProfile(data.user||data.session?.user);}
  }catch(err){setToast(err.message||"Sign-in failed");}finally{setCloudBusy(false);}};
  const signOut=async()=>{if(!CLOUD_CLIENT)return;setCloudBusy(true);hydratedUserRef.current=null;setAccountUserId(null);setSession(null);try{const {error}=await CLOUD_CLIENT.auth.signOut({scope:"local"});if(error)console.warn("Remote sign-out could not be confirmed; this device was signed out locally.",error);}finally{setSyncStatus("Signed out");setCloudBusy(false);}};

  const doneCount=done.size;
  const elapsed=Math.min(Math.max(todayPlanDay,0),planDayCount());
  const pace=doneCount-elapsed;
  const oldestUnread=useMemo(()=>{for(let i=1;i<=Math.min(elapsed,planDayCount());i++)if(!done.has(i))return i;return null;},[done,elapsed]);
  const streak=useMemo(()=>{let s=0,d=done.has(currentDay)?currentDay:currentDay-1;while(d>=1&&done.has(d)){s++;d--;}return s;},[done,currentDay]);

  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t);},[toast]);

  const shownDay=viewDay==null?currentDay:viewDay;
  const openDay=(n)=>{setViewDay(Math.min(Math.max(n,1),planDayCount()));setTab("today");};

  if(loadError)return <div className="app"><Styles/><main className="main"><div className="main-inner"><div className="settings">{loadError}</div></div></main></div>;
  if(!loaded) return <div className="app"><Styles/></div>;
  if(!session?.user)return <AccountGate configured={!!CLOUD_CLIENT} busy={cloudBusy} onAuth={authenticate} message={toast}/>;
  if(accountUserId!==session.user.id)return <div className="app"><Styles/><div className="account-shell"><div className="account-card"><div className="account-mark"><img src="icon.svg?v=7" alt=""/></div><h1>Opening {readerName(session.user,readerDisplayName)}’s plan…</h1></div></div></div>;

  return (
    <div className="app">
      <Styles/>
      <header className="hdr">
        <div className="hdr-top">
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <BibleLogoMark/>
            <div>
              <div className="eyebrow">Chronological Bible · One Year</div>
              <h1 className="hdr-title">Day {currentDay} <span className="of">of {planDayCount()}</span></h1>
            </div>
          </div>
          <div className="hdr-stat">
            <div className="hdr-pct">{Math.round((doneCount/planDayCount())*100)}%</div>
            <div className="hdr-pct-lbl">read</div>
          </div>
        </div>
        <EpochRibbon done={done} currentDay={currentDay} onJump={openDay}/>
      </header>

      <main className="main">
        <div className="main-inner">
          {tab==="today"&&<DayView day={shownDay} done={done} currentDay={currentDay} startDate={startDate} bibleVersion={bibleVersion} sealing={sealing} onToggle={(n)=>toggleDay(n,true)} onNav={(n)=>setViewDay(Math.min(Math.max(n,1),planDayCount()))} onToday={()=>setViewDay(null)}/>}
          {tab==="week"&&<WeekView weekIdx={weekIdx==null?Math.floor((currentDay-1)/nightsPerWeek()):weekIdx} setWeekIdx={setWeekIdx} done={done} currentDay={currentDay} startDate={startDate} onOpen={openDay} onToggle={(n)=>toggleDay(n)}/>}
          {tab==="month"&&<MonthView cursor={monthCursor||{y:today.getFullYear(),m:today.getMonth()}} setCursor={setMonthCursor} done={done} startDate={startDate} currentDay={currentDay} today={today} onOpen={openDay}/>}
          {tab==="plan"&&<PlanView theme={theme} accent={accent} onAppearanceChange={changeAppearance} textSize={textSize} onTextSizeChange={(v)=>{setTextSize(v);try{localStorage.setItem(TEXT_SIZE_KEY,String(v));}catch(e){}}} done={done} doneCount={doneCount} pace={pace} streak={streak} oldestUnread={oldestUnread} start={start} bibleVersion={bibleVersion} onBibleVersionChange={(v)=>{changeSettings(start,v);setToast(`Bible links set to ${v}`);}} onJump={openDay} onStartChange={(s)=>{changeSettings(s,bibleVersion);setToast("Start date updated");}} confirmReset={confirmReset} setConfirmReset={setConfirmReset} onReset={()=>{const e=new Set(),p={...pending};done.forEach(n=>p[n]="incomplete");setDone(e);setPending(p);saveState({start,bibleVersion,theme,accent,done:e,pending:p,settingsPending});setConfirmReset(false);setToast("Progress cleared");}} session={session} readerDisplayName={readerDisplayName} syncStatus={syncStatus} cloudBusy={cloudBusy} onSync={syncCloud} onSignOut={signOut}/>}
        </div>
      </main>

      {toast&&<div className="toast">{toast}</div>}

      <nav className="tabs">
        {[["today","Today",IconBook],["week","Week",IconWeek],["month","Month",IconMonth],["plan","Journey",IconScroll]].map(([id,label,Ic])=>(
          <button key={id} className={"tab "+(tab===id?"tab-on":"")} onClick={()=>{setTab(id);if(id==="today")setViewDay(null);}}>
            <Ic on={tab===id}/><span>{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

function EpochRibbon({done,currentDay,onJump}){
  let frontier=0;while(done.has(frontier+1))frontier++;
  const spans=epochSpans();
  return (
    <div className="ribbon-wrap">
      <div className="ribbon">
        {spans.map(({e,n},i)=>{
          const startD=spans.slice(0,i).reduce((a,s)=>a+s.n,0)+1;
          const endD=startD+n-1;
          const fillPct=frontier>=endD?100:frontier>=startD?((frontier-startD+1)/n)*100:0;
          const isCur=currentDay>=startD&&currentDay<=endD;
          return (
            <button key={e} className={"rib-seg "+(isCur?"rib-cur":"")} style={{flexGrow:n}} title={"Epoch "+e+" — "+EPOCH_NAMES[e]} onClick={()=>onJump(startD)}>
              <span className="rib-fill" style={{width:fillPct+"%"}}/>
              {isCur&&<span className="rib-marker" style={{left:(((currentDay-startD+0.5)/n)*100)+"%"}}/>}
            </button>
          );
        })}
      </div>
      <div className="ribbon-lbl">
        <span>Creation</span>
        <span className="ribbon-epoch">Epoch {epochNums(PLAN.days[currentDay-1])[0]} · {EPOCH_NAMES[epochNums(PLAN.days[currentDay-1])[0]]}</span>
        <span>Church Age</span>
      </div>
    </div>
  );
}

function DayView({day,done,currentDay,startDate,bibleVersion,onToggle,onNav,onToday,sealing}){
  const d=PLAN.days[day-1],epochs=epochNums(d);const e1=epochs[0]||1,e2=epochs[epochs.length-1]||e1,verses=d.verse_count,refs=d.readings;
  const groupTitles=[...new Set((d.context_groups||[]).map(g=>g.title).filter(Boolean))];
  const pages=(d.source_printed_pages||[]).slice().sort((a,b)=>a-b);
  // One entry per distinct note or visual; a page shared by two readings would
  // otherwise list its apparatus twice.
  const sameRef=(a,b)=>String(a||'').replace(/[‐-―]/g,'-').replace(/s+/g,'')===String(b||'').replace(/[‐-―]/g,'-').replace(/s+/g,'');
  const seenNote=new Set(),notes=(d.background_notes||[]).filter(n=>{const k=n.title+"|"+n.printedPage;if(seenNote.has(k))return false;seenNote.add(k);return true;});
  const seenVis=new Set(),visuals=(d.visuals||[]).filter(v=>{const k=v.title+"|"+v.printedPage;if(seenVis.has(k))return false;seenVis.add(k);return true;});
  const date=dateForPlanDay(day,startDate);const isDone=done.has(day);const isToday=day===currentDay;
  const epochLabel=e1===e2?("Epoch "+e1+" — "+EPOCH_NAMES[e1]):("Epoch "+e1+" → "+e2+" — crossing into "+EPOCH_NAMES[e2]);

    <section className="dayview">
      <div className="day-nav">

          <div className="day-date">{fmtLong(date)}</div>
          <div className="day-sub">Day {day} · Week {d.week}{!isToday&&<button className="link-btn" onClick={onToday}>· back to today</button>}</div>
        </div>

          <span className="epoch-num">{e1===e2?e1:(e1+"–"+e2)}</span>
          <div><div className="epoch-name">{epochLabel}</div><div className="epoch-era">{EPOCH_ERAS[e2]}</div></div>
        </div>

        <div className="load-row"><span>about {Math.round(d.estimated_minutes)} min</span><span className="load-dot">·</span><span>{verses} verses</span><span className="load-dot">·</span><span>{refs.length} reading{refs.length!==1?"s":""}</span>{pages.length>0&&<><span className="load-dot">·</span><span>printed p.{pages.length===1?pages[0]:pages[0]+"–"+pages[pages.length-1]}</span></>}</div>
        <ul className="refs">{refs.map((r,i)=>(<li key={r.segment_id} className="ref"><span className="ref-pg">READ {i+1}</span><span className="ref-txt">{r.reference}</span>{r.publisher_block_reference&&r.covers_whole_block===false&&<span className="ref-block">part of {r.publisher_block_reference}</span>}<a className="read-link" href={`https://www.biblegateway.com/passage/?search=${encodeURIComponent(r.reference)}&version=${encodeURIComponent(bibleVersion)}`} target="_blank" rel="noopener noreferrer">Open in {bibleVersion} ↗</a></li>))}</ul>
        {notes.length>0&&<div className="apparatus">
          <div className="app-head">Background notes on these pages</div>
          <ul className="app-list">{notes.map((n,i)=>(<li key={"n"+i} className="app-item">
            <span className="app-title">{n.title}</span>
            {n.scriptureCitation&&<span className="app-cite">{n.scriptureCitation}</span>}

          <div className="app-head">Maps, charts and panels</div>
          <ul className="app-list">{visuals.map((v,i)=>(<li key={"v"+i} className="app-item">
            <span className="app-kind">{v.kind.replace(/-/g," ")}</span>
            <span className="app-title">{v.title}</span>
            <span className="app-page">p.{v.printedPage}</span>
          </li>))}</ul>
        </div>}
        <button className={"seal-btn "+(isDone?"seal-on ":"")+(sealing?"sealing":"")} onClick={()=>onToggle(day)}>
          {isDone?(<><SealMark/> Read · {fmtLong(date).split(",")[0]} sealed</>):"Mark today's reading complete"}
        </button>

      </article>
    </section>

}

function WeekView({weekIdx,setWeekIdx,done,currentDay,startDate,onOpen,onToggle}){
  const per=nightsPerWeek();const first=weekIdx*per+1;const days=[];for(let n=first;n<first+per&&n<=planDayCount();n++)days.push(n);
  const wkDone=days.filter(n=>done.has(n)).length;
  return (
    <section>
      <div className="day-nav">
        <button className="nav-btn" onClick={()=>setWeekIdx(weekIdx-1)} disabled={weekIdx<=0}>‹</button>
        <div className="day-nav-mid"><div className="day-date">Week {weekIdx+1} of {weekCount()}</div><div className="day-sub">{wkDone} of {days.length} readings done</div></div>
        <button className="nav-btn" onClick={()=>setWeekIdx(weekIdx+1)} disabled={weekIdx>=52}>›</button>
      </div>
      <div className="wk-list">{days.map(n=>{const d=PLAN.days[n-1];const date=dateForPlanDay(n,startDate);const isDone=done.has(n);const isToday=n===currentDay;const refs=d.readings.map(r=>r.reference).join(" · ");
        return (<div key={n} className={"wk-row "+(isToday?"wk-today":"")}>
          <button className={"wk-check "+(isDone?"wk-check-on":"")} onClick={()=>onToggle(n)}>{isDone&&<SealMark small/>}</button>

            <div className="wk-line1"><span className="wk-day">Day {n}</span><span className="wk-date">{DOW[date.getDay()]} {date.getDate()} {MONTHS[date.getMonth()].slice(0,3)}</span>{isToday&&<span className="wk-pill">today</span>}</div>

          </button>
        </div>);
      })}</div>

function MonthView({cursor,setCursor,done,startDate,currentDay,today,onOpen}){
  const y=cursor.y,m=cursor.m;const firstOfMonth=new Date(y,m,1);const startOffset=firstOfMonth.getDay();const daysInMonth=new Date(y,m+1,0).getDate();
  const cells=[];for(let i=0;i<startOffset;i++)cells.push(null);for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const move=dir=>{const nm=m+dir;setCursor({y:y+Math.floor(nm/12),m:((nm%12)+12)%12});};
  const planEnd=addDays(startDate,364);
  const canBack=new Date(y,m,1)>new Date(startDate.getFullYear(),startDate.getMonth(),1);
  const canFwd=new Date(y,m,1)<new Date(planEnd.getFullYear(),planEnd.getMonth(),1);
  let monthDone=0,monthInPlan=0;
  for(let d=1;d<=daysInMonth;d++){const dd=new Date(y,m,d);const pn=isReadingNight(dd)?planDayForDate(dd,startDate):0;if(pn>=1&&pn<=planDayCount()){monthInPlan++;if(done.has(pn))monthDone++;}}
  return (
    <section>
      <div className="day-nav">
        <button className="nav-btn" onClick={()=>move(-1)} disabled={!canBack}>‹</button>
        <div className="day-nav-mid"><div className="day-date">{MONTHS[m]} {y}</div><div className="day-sub">{monthDone} of {monthInPlan} readings done</div></div>
        <button className="nav-btn" onClick={()=>move(1)} disabled={!canFwd}>›</button>
      </div>
      <div className="cal">
        {DOW.map(d=><div key={d} className="cal-dow">{d[0]}</div>)}
        {cells.map((d,i)=>{if(d===null)return <div key={"b"+i}/>;const date=new Date(y,m,d);const pn=isReadingNight(date)?planDayForDate(date,startDate):0;const inPlan=pn>=1&&pn<=planDayCount();const isDone=inPlan&&done.has(pn);const isToday=diffDays(date,today)===0;const missed=inPlan&&!isDone&&pn<currentDay;
          return (<button key={d} className={["cal-cell",inPlan?"":"cal-out",isDone?"cal-done":"",isToday?"cal-today":"",missed?"cal-missed":""].join(" ")} disabled={!inPlan} onClick={()=>onOpen(pn)}>
            <span>{d}</span>{isDone&&<span className="cal-seal"/>}{missed&&<span className="cal-miss-dot"/>}
          </button>);
        })}
      </div>
      <div className="legend"><span><i className="lg lg-done"/> read</span><span><i className="lg lg-miss"/> to catch up</span><span><i className="lg lg-today"/> today</span></div>
    </section>
  );
}

function AccountGate({configured,busy,onAuth,message}){
  const [mode,setMode]=useState("signin");
  const [displayName,setDisplayName]=useState("");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [showPassword,setShowPassword]=useState(false);
  const ready=configured&&email.trim()&&password.length>=6&&(mode==="signin"||displayName.trim());
  const submit=e=>{e.preventDefault();if(ready&&!busy)onAuth(mode,email,password,displayName);};
  return <div className="app"><Styles/><div className="account-shell"><form className="account-card" onSubmit={submit}>
    <div className="account-mark"><img src="icon.svg?v=7" alt=""/></div>
    <h1>Chronological Bible</h1>
    <p className="account-intro">Each family member uses their own account so progress stays private and follows them across devices.</p>
    <div className="account-modes"><button type="button" className={mode==="signin"?"mode-on":""} onClick={()=>setMode("signin")}>Sign in</button><button type="button" className={mode==="signup"?"mode-on":""} onClick={()=>setMode("signup")}>Create account</button></div>
    {!configured&&<div className="account-message">Account services are not configured. The reading plan cannot open until the cloud connection is restored.</div>}
    {mode==="signup"&&<label className="auth-field"><span>Reader’s name</span><input autoComplete="name" value={displayName} onChange={e=>setDisplayName(e.target.value)} placeholder="Name shown in the app"/></label>}
    <label className="auth-field"><span>Email</span><input type="email" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></label>
    <label className="auth-field"><span>Password</span><span className="password-wrap"><input type={showPassword?"text":"password"} autoComplete={mode==="signup"?"new-password":"current-password"} value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 6 characters"/><button type="button" onClick={()=>setShowPassword(v=>!v)}>{showPassword?"Hide":"Show"}</button></span></label>
    <button className="primary-btn account-submit" disabled={!ready||busy}>{busy?"Please wait…":mode==="signup"?"Create account":"Sign in"}</button>
    {message&&<div className="account-message">{message}</div>}
    <p className="account-foot">Your old shared-device progress will not be assigned to this account. Each reader begins and records progress independently.</p>
  </form></div></div>;
}

function PlanView({theme,accent,onAppearanceChange,textSize,onTextSizeChange,done,doneCount,pace,streak,oldestUnread,start,bibleVersion,onBibleVersionChange,onJump,onStartChange,confirmReset,setConfirmReset,onReset,session,readerDisplayName,syncStatus,cloudBusy,onSync,onSignOut}){
  const pct=Math.round((doneCount/planDayCount())*100);
  const paceTxt=pace===0?"On pace":pace>0?(pace+" day"+(pace>1?"s":"")+" ahead"):((-pace)+" day"+(pace<-1?"s":"")+" behind");
  return (
    <section className="plan">
      <div className="stat-grid">
        <Stat big={""+doneCount} lbl="days read"/>
        <Stat big={pct+"%"} lbl="of the Bible"/>
        <Stat big={""+streak} lbl="day streak"/>
        <Stat big={paceTxt} lbl="vs the calendar" tone={pace<0?"warn":"good"} small/>
      </div>
      {oldestUnread&&<button className="catchup" onClick={()=>onJump(oldestUnread)}><span className="catchup-lbl">Catch up</span><span>Oldest unread is Day {oldestUnread} — open it →</span></button>}
      <h2 className="sec-title">The nine epochs</h2>
      <div className="ep-list">{Object.keys(EPOCH_NAMES).map(k=>{const e=+k;const daysIn=PLAN.days.filter(d=>epochNums(d).includes(e));const first=daysIn[0].day;const doneIn=daysIn.filter(d=>done.has(d.day)).length;const p=Math.round((doneIn/daysIn.length)*100);
        return (<button key={e} className="ep-row" onClick={()=>onJump(first)}>
          <span className="ep-num">{e}</span>
          <span className="ep-mid"><span className="ep-name">{EPOCH_NAMES[e]}</span><span className="ep-era">{EPOCH_ERAS[e]} · {daysIn.length} days</span><span className="ep-bar"><span style={{width:p+"%"}}/></span></span>
          <span className="ep-pct">{p}%</span>
        </button>);
      })}</div>
      <h2 className="sec-title">Settings</h2>
      <div className="settings">
        <label className="set-row"><span>Day 1 of the plan</span><input type="date" value={start} onChange={e=>e.target.value&&onStartChange(e.target.value)}/></label>
        <div className="set-note">Set this to the day your group begins. Completed readings stay attached to their plan day if you re-anchor the start date.</div>
        <label className="set-row"><span>Reading theme</span><select value={theme} onChange={e=>onAppearanceChange(e.target.value,accent)}>{THEMES.map(([label,v])=><option key={v} value={v}>{label}</option>)}</select></label>
        <div className="set-note">Light is mainly white with blue content. Dark is mainly deep blue with white content.</div>
        <div className="accent-setting"><span>Accent colour</span><div className="accent-options" role="group" aria-label="Accent colour">{ACCENTS.map(([label,v])=><button key={v} type="button" className={"accent-choice accent-"+v+(accent===v?" accent-on":"")} aria-pressed={accent===v} onClick={()=>onAppearanceChange(theme,v)}><span className="accent-dot"/><span>{label}</span></button>)}</div></div>
        <div className="set-note">Accents colour highlights only; the church’s blue and white remain the foundation.</div>
        <label className="set-row"><span>Text size</span><select value={textSize} onChange={e=>onTextSizeChange(parseFloat(e.target.value))}>{TEXT_SIZES.map(([label,v])=><option key={label} value={v}>{label}</option>)}</select></label>
        <div className="set-note">Applies to this device only, so each reader can set their own.</div>
        <label className="set-row"><span>Bible version for links</span><select value={bibleVersion} onChange={e=>onBibleVersionChange(e.target.value)}>{VERSION_OPTIONS.map(v=><option key={v} value={v}>{v}</option>)}</select></label>
        <div className="set-note">The schedule stores only book-and-chapter references, so it can be opened in any listed translation without changing the chronological order.</div>
        {!confirmReset?<button className="danger-btn" onClick={()=>setConfirmReset(true)}>Reset all progress</button>:
        <div className="confirm-row"><span>Clear all {doneCount} completed days?</span><button className="danger-btn solid" onClick={onReset}>Yes, clear</button><button className="ghost-btn" onClick={()=>setConfirmReset(false)}>Keep</button></div>}
      </div>
      <h2 className="sec-title">Cloud sync</h2>
      <div className="settings cloud-card">
        <div className="cloud-user"><span className="cloud-dot"/><span><strong>{readerName(session.user,readerDisplayName)}</strong><small>{session.user.email} · {syncStatus}</small></span></div>
        <div className="set-note">Completion, start date, and Bible-link preference follow this account across devices. Offline changes stay in this account’s private device cache until the connection returns.</div>
        <div className="auth-actions"><button className="primary-btn" disabled={cloudBusy} onClick={onSync}>Sync now</button><button className="ghost-btn" disabled={cloudBusy} onClick={onSignOut}>Sign out on this device</button></div>
      </div>
      <div className="colophon">NKJV Chronological Study Bible · publisher-block order · {planDayCount()} sittings · 787 publisher blocks · 31,102 verses · reference-only, translation-neutral dataset</div>
    </section>
  );
}

        .main{grid-column:2;grid-row:1 / span 2;}
        .main-inner{max-width:760px;padding:24px 32px 40px;}
        .cal-cell{font-size:calc(15px * var(--fs, 1));border-radius:11px;}
        .ref-txt{font-size:calc(19px * var(--fs, 1));}
        .toast{bottom:32px;left:auto;right:32px;transform:none;}
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
