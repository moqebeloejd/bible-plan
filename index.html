<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>Chronological Bible · One Year</title>
<meta name="description" content="Read through the Bible in one year on a chronological plan — nine epochs from Creation to the Church Age." />
<meta name="theme-color" content="#161d14" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bible · One Year" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#161d14;--ink-2:#20291c;--olive:#4a5c39;--olive-soft:#5f7349;--vellum:#f5efdf;--vellum-2:#ede4cd;--gold:#c9a44a;--gold-deep:#a8842f;--clay:#b06a44;--faded:#a8a48d;--line:rgba(245,239,223,0.14);}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
  html,body,#root{height:100%;margin:0;background:var(--ink);}
  body{overscroll-behavior:none;}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--faded);font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;z-index:99;}
</style>
</head>
<body>
<div id="boot">Opening your reading plan…</div>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="cloud-config.js"></script>
<script src="vendor/supabase.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

let PLAN=null;
const PLAN_URL="./data/reading-plan-v2.json";

const EPOCH_NAMES={1:"Before the Patriarchs",2:"The Patriarchs, Israel's Ancestors",3:"The Rise of a Unified People",4:"From Tribes to a Nation",5:"The Fall of Two Nations",6:"Exile and Return",7:"Between the Two Testaments",8:"The Coming of the Messiah",9:"The Church Age"};
const EPOCH_ERAS={1:"Creation to 2000 B.C.",2:"2000 to 1500 B.C.",3:"1500 to 1200 B.C.",4:"1200 to 930 B.C.",5:"930 to 586 B.C.",6:"586 to 332 B.C.",7:"332 B.C. to A.D. 30",8:"6 B.C. to A.D. 30",9:"A.D. 30 to 100"};
const LEGACY_STORAGE_KEY="bible365-v1";
const STORAGE_KEY="bible365-v2";
const DEFAULT_START="2026-06-07";
const DEFAULT_VERSION="NKJV";
const VERSION_OPTIONS=["NKJV","KJV","ESV","NIV","NLT","NASB","NRSVUE","CSB","NET","AMP"];
const CLOUD_CONFIG=window.BIBLE_CLOUD||{};
const CLOUD_CLIENT=window.supabase&&CLOUD_CONFIG.url&&CLOUD_CONFIG.publishableKey
  ? window.supabase.createClient(CLOUD_CONFIG.url,CLOUD_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})
  : null;
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtLong=d=>`${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
const epochNums=d=>(d.epochs||[]).map(x=>Number((x.match(/Epoch\s+(\d+)/)||[])[1])).filter(Boolean);
const epochSpans=()=>{const c={};PLAN.days.forEach(d=>{const e=epochNums(d)[0]||1;c[e]=(c[e]||0)+1;});return Object.keys(c).map(k=>({e:+k,n:c[k]}));};
const writeLocal=(state)=>{localStorage.setItem(STORAGE_KEY,JSON.stringify({
  planId:PLAN.plan_id,start:state.start,bibleVersion:state.bibleVersion,done:[...state.done].sort((a,b)=>a-b),
  pending:state.pending||{},settingsPending:!!state.settingsPending,cloudUserId:state.cloudUserId||null
}));};

function loadLocal(plan){
  try{
    const current=localStorage.getItem(STORAGE_KEY);
    if(current){const s=JSON.parse(current);return {start:s.start||DEFAULT_START,bibleVersion:s.bibleVersion||DEFAULT_VERSION,done:new Set(Array.isArray(s.done)?s.done:[]),pending:s.pending||{},settingsPending:!!s.settingsPending,cloudUserId:s.cloudUserId||null,migrated:false};}
    const legacy=localStorage.getItem(LEGACY_STORAGE_KEY);
    if(legacy){
      const old=JSON.parse(legacy),oldDone=new Set(Array.isArray(old.done)?old.done:[]);
      const migrated=plan.days.filter(d=>(d.migration?.required_legacy_days||[]).every(n=>oldDone.has(n))).map(d=>d.day);
      const pending=Object.fromEntries(migrated.map(n=>[n,"complete"]));
      return {start:old.start||DEFAULT_START,bibleVersion:DEFAULT_VERSION,done:new Set(migrated),pending,settingsPending:true,cloudUserId:null,migrated:true};
    }
  }catch(e){}
  return {start:DEFAULT_START,bibleVersion:DEFAULT_VERSION,done:new Set(),pending:{},settingsPending:true,cloudUserId:null,migrated:false};
}

function App(){
  const [start,setStart]=useState(DEFAULT_START);
  const [bibleVersion,setBibleVersion]=useState(DEFAULT_VERSION);
  const [done,setDone]=useState(new Set());
  const [pending,setPending]=useState({});
  const [settingsPending,setSettingsPending]=useState(true);
  const [cloudUserId,setCloudUserId]=useState(null);
  const [session,setSession]=useState(null);
  const [syncStatus,setSyncStatus]=useState(CLOUD_CLIENT?"Sign in to sync":"Local only");
  const [cloudBusy,setCloudBusy]=useState(false);
  const [loaded,setLoaded]=useState(false);
  const [loadError,setLoadError]=useState(null);
  const [tab,setTab]=useState("today");
  const [viewDay,setViewDay]=useState(null);
  const [weekIdx,setWeekIdx]=useState(null);
  const [monthCursor,setMonthCursor]=useState(null);
  const [sealing,setSealing]=useState(false);
  const [confirmReset,setConfirmReset]=useState(false);
  const [toast,setToast]=useState(null);
  const stateRef=useRef({start,bibleVersion,done,pending,settingsPending,cloudUserId});
  const hydratedUserRef=useRef(null);

  useEffect(()=>{stateRef.current={start,bibleVersion,done,pending,settingsPending,cloudUserId};},[start,bibleVersion,done,pending,settingsPending,cloudUserId]);

  const today=new Date();
  const startDate=parseISO(start);
  const todayPlanDay=diffDays(today,startDate)+1;
  const currentDay=Math.min(Math.max(todayPlanDay,1),365);

  useEffect(()=>{
    let cancelled=false,subscription;
    (async()=>{
      try{
        const res=await fetch(PLAN_URL,{cache:"no-cache"});if(!res.ok)throw new Error("Reading plan could not be loaded.");
        const plan=await res.json();if(plan.day_count!==365||plan.days?.length!==365)throw new Error("Reading plan failed its day-count check.");
        PLAN=plan;
        const local=loadLocal(plan);if(cancelled)return;
        setStart(local.start);setBibleVersion(local.bibleVersion);setDone(local.done);setPending(local.pending);setSettingsPending(local.settingsPending);setCloudUserId(local.cloudUserId);
        writeLocal(local);
        if(local.migrated)setToast(`${local.done.size} completed days carried into the whole-chapter plan`);
        if(CLOUD_CLIENT){
          try{
            const {data}=await CLOUD_CLIENT.auth.getSession();if(!cancelled)setSession(data.session||null);
            subscription=CLOUD_CLIENT.auth.onAuthStateChange((_event,next)=>setSession(next)).data.subscription;
          }catch(e){if(!cancelled)setSyncStatus("Offline — local progress is available");}
        }
        setLoaded(true);const b=document.getElementById("boot");if(b)b.remove();
      }catch(err){setLoadError(err.message||"Unable to open the reading plan.");const b=document.getElementById("boot");if(b)b.textContent=err.message||"Unable to open the reading plan.";}
    })();
    return()=>{cancelled=true;subscription?.unsubscribe();};
  },[]);

  const saveState=useCallback((next)=>{try{writeLocal(next);}catch(e){setToast("Couldn't save — progress is held for this session");}},[]);

  const syncCloud=useCallback(async()=>{
    if(!CLOUD_CLIENT||!session?.user||!PLAN)return;
    const uid=session.user.id,s=stateRef.current,firstLink=!s.cloudUserId,sameUser=s.cloudUserId===uid;
    setSyncStatus(navigator.onLine?"Syncing…":"Offline — changes queued");if(!navigator.onLine)return;
    try{
      let operations=sameUser?{...s.pending}:firstLink?Object.fromEntries([...s.done].map(n=>[n,"complete"])):{};
      const completeIds=Object.keys(operations).filter(k=>operations[k]==="complete");
      const incompleteIds=Object.keys(operations).filter(k=>operations[k]==="incomplete");
      if(completeIds.length){const now=new Date().toISOString();const rows=completeIds.map(day=>({user_id:uid,plan_id:PLAN.plan_id,day_id:`CRP2-D${String(day).padStart(3,"0")}`,completed_at:now,updated_at:now}));const {error}=await CLOUD_CLIENT.from("bible_reader_progress").upsert(rows,{onConflict:"user_id,plan_id,day_id"});if(error)throw error;}
      if(incompleteIds.length){const ids=incompleteIds.map(day=>`CRP2-D${String(day).padStart(3,"0")}`);const {error}=await CLOUD_CLIENT.from("bible_reader_progress").delete().eq("user_id",uid).eq("plan_id",PLAN.plan_id).in("day_id",ids);if(error)throw error;}
      if(firstLink||(sameUser&&s.settingsPending)){const {error}=await CLOUD_CLIENT.from("bible_reader_settings").upsert({user_id:uid,plan_id:PLAN.plan_id,start_date:s.start,bible_version:s.bibleVersion,updated_at:new Date().toISOString()},{onConflict:"user_id,plan_id"});if(error)throw error;}
      const [{data:cloudRows,error:progressError},{data:cloudSettings,error:settingsError}]=await Promise.all([
        CLOUD_CLIENT.from("bible_reader_progress").select("day_id").eq("user_id",uid).eq("plan_id",PLAN.plan_id),
        CLOUD_CLIENT.from("bible_reader_settings").select("start_date,bible_version").eq("user_id",uid).eq("plan_id",PLAN.plan_id).maybeSingle()
      ]);if(progressError)throw progressError;if(settingsError)throw settingsError;
      const cloudDone=new Set((cloudRows||[]).map(r=>Number(r.day_id.slice(-3))));
      const latest=stateRef.current,remaining={...latest.pending};Object.entries(operations).forEach(([k,v])=>{if(remaining[k]===v)delete remaining[k];});
      Object.entries(remaining).forEach(([k,v])=>v==="complete"?cloudDone.add(Number(k)):cloudDone.delete(Number(k)));
      const nextStart=cloudSettings?.start_date||latest.start,nextVersion=cloudSettings?.bible_version||latest.bibleVersion;
      setDone(cloudDone);setPending(remaining);setStart(nextStart);setBibleVersion(nextVersion);setSettingsPending(false);setCloudUserId(uid);
      saveState({start:nextStart,bibleVersion:nextVersion,done:cloudDone,pending:remaining,settingsPending:false,cloudUserId:uid});setSyncStatus("Synced");
    }catch(err){console.error(err);setSyncStatus("Offline — changes queued");}
  },[session,saveState]);

  useEffect(()=>{if(!loaded||!session?.user)return;const uid=session.user.id,needsSync=hydratedUserRef.current!==uid||cloudUserId!==uid||settingsPending||Object.keys(pending).length>0;if(!needsSync)return;hydratedUserRef.current=uid;const t=setTimeout(syncCloud,250);return()=>clearTimeout(t);},[loaded,session,pending,settingsPending,cloudUserId,syncCloud]);
  useEffect(()=>{const onOnline=()=>syncCloud();const onFocus=()=>syncCloud();window.addEventListener("online",onOnline);window.addEventListener("focus",onFocus);return()=>{window.removeEventListener("online",onOnline);window.removeEventListener("focus",onFocus);};},[syncCloud]);

  const toggleDay=(n,withSeal)=>{const next=new Set(done),marking=!next.has(n);marking?next.add(n):next.delete(n);const nextPending={...pending,[n]:marking?"complete":"incomplete"};setDone(next);setPending(nextPending);saveState({start,bibleVersion,done:next,pending:nextPending,settingsPending,cloudUserId});if(marking&&withSeal){setSealing(true);setTimeout(()=>setSealing(false),700);}};
  const changeSettings=(nextStart,nextVersion)=>{setStart(nextStart);setBibleVersion(nextVersion);setSettingsPending(true);saveState({start:nextStart,bibleVersion:nextVersion,done,pending,settingsPending:true,cloudUserId});};
  const authenticate=async(mode,email,password)=>{if(!CLOUD_CLIENT)return;setCloudBusy(true);try{const options=mode==="signup"?{email,password,options:{emailRedirectTo:location.origin+location.pathname}}:{email,password};const {data,error}=mode==="signup"?await CLOUD_CLIENT.auth.signUp(options):await CLOUD_CLIENT.auth.signInWithPassword(options);if(error)throw error;if(mode==="signup"&&!data.session)setToast("Account created — check your email to confirm it");else setToast("Signed in — synchronising progress");}catch(err){setToast(err.message||"Sign-in failed");}finally{setCloudBusy(false);}};
  const signOut=async()=>{if(!CLOUD_CLIENT)return;setCloudBusy(true);try{await CLOUD_CLIENT.auth.signOut();hydratedUserRef.current=null;setSession(null);setSyncStatus("Signed out — progress remains on this device");setToast("Signed out");}finally{setCloudBusy(false);}};

  const doneCount=done.size;
  const elapsed=Math.min(Math.max(todayPlanDay,0),365);
  const pace=doneCount-elapsed;
  const oldestUnread=useMemo(()=>{for(let i=1;i<=Math.min(elapsed,365);i++)if(!done.has(i))return i;return null;},[done,elapsed]);
  const streak=useMemo(()=>{let s=0,d=done.has(currentDay)?currentDay:currentDay-1;while(d>=1&&done.has(d)){s++;d--;}return s;},[done,currentDay]);

  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t);},[toast]);

  const shownDay=viewDay==null?currentDay:viewDay;
  const openDay=(n)=>{setViewDay(Math.min(Math.max(n,1),365));setTab("today");};

  if(loadError)return <div className="app"><Styles/><main className="main"><div className="main-inner"><div className="settings">{loadError}</div></div></main></div>;
  if(!loaded) return <div className="app"><Styles/></div>;

  return (
    <div className="app">
      <Styles/>
      <header className="hdr">
        <div className="hdr-top">
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <BibleLogoMark/>
            <div>
              <div className="eyebrow">Chronological Bible · One Year</div>
              <h1 className="hdr-title">Day {currentDay} <span className="of">of 365</span></h1>
            </div>
          </div>
          <div className="hdr-stat">
            <div className="hdr-pct">{Math.round((doneCount/365)*100)}%</div>
            <div className="hdr-pct-lbl">read</div>
          </div>
        </div>
        <EpochRibbon done={done} currentDay={currentDay} onJump={openDay}/>
      </header>

      <main className="main">
        <div className="main-inner">
          {tab==="today"&&<DayView day={shownDay} done={done} currentDay={currentDay} startDate={startDate} bibleVersion={bibleVersion} sealing={sealing} onToggle={(n)=>toggleDay(n,true)} onNav={(n)=>setViewDay(Math.min(Math.max(n,1),365))} onToday={()=>setViewDay(null)}/>}
          {tab==="week"&&<WeekView weekIdx={weekIdx==null?Math.floor((currentDay-1)/7):weekIdx} setWeekIdx={setWeekIdx} done={done} currentDay={currentDay} startDate={startDate} onOpen={openDay} onToggle={(n)=>toggleDay(n)}/>}
          {tab==="month"&&<MonthView cursor={monthCursor||{y:today.getFullYear(),m:today.getMonth()}} setCursor={setMonthCursor} done={done} startDate={startDate} currentDay={currentDay} today={today} onOpen={openDay}/>}
          {tab==="plan"&&<PlanView done={done} doneCount={doneCount} pace={pace} streak={streak} oldestUnread={oldestUnread} start={start} bibleVersion={bibleVersion} onBibleVersionChange={(v)=>{changeSettings(start,v);setToast(`Bible links set to ${v}`);}} onJump={openDay} onStartChange={(s)=>{changeSettings(s,bibleVersion);setToast("Start date updated");}} confirmReset={confirmReset} setConfirmReset={setConfirmReset} onReset={()=>{const e=new Set(),p={...pending};done.forEach(n=>p[n]="incomplete");setDone(e);setPending(p);saveState({start,bibleVersion,done:e,pending:p,settingsPending,cloudUserId});setConfirmReset(false);setToast("Progress cleared");}} session={session} syncStatus={syncStatus} cloudBusy={cloudBusy} cloudConfigured={!!CLOUD_CLIENT} onAuth={authenticate} onSignOut={signOut}/>}
        </div>
      </main>

      {toast&&<div className="toast">{toast}</div>}

      <nav className="tabs">
        {[["today","Today",IconBook],["week","Week",IconWeek],["month","Month",IconMonth],["plan","Journey",IconScroll]].map(([id,label,Ic])=>(
          <button key={id} className={"tab "+(tab===id?"tab-on":"")} onClick={()=>{setTab(id);if(id==="today")setViewDay(null);}}>
            <Ic on={tab===id}/><span>{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

function EpochRibbon({done,currentDay,onJump}){
  let frontier=0;while(done.has(frontier+1))frontier++;
  const spans=epochSpans();
  return (
    <div className="ribbon-wrap">
      <div className="ribbon">
        {spans.map(({e,n},i)=>{
          const startD=spans.slice(0,i).reduce((a,s)=>a+s.n,0)+1;
          const endD=startD+n-1;
          const fillPct=frontier>=endD?100:frontier>=startD?((frontier-startD+1)/n)*100:0;
          const isCur=currentDay>=startD&&currentDay<=endD;
          return (
            <button key={e} className={"rib-seg "+(isCur?"rib-cur":"")} style={{flexGrow:n}} title={"Epoch "+e+" — "+EPOCH_NAMES[e]} onClick={()=>onJump(startD)}>
              <span className="rib-fill" style={{width:fillPct+"%"}}/>
              {isCur&&<span className="rib-marker" style={{left:(((currentDay-startD+0.5)/n)*100)+"%"}}/>}
            </button>
          );
        })}
      </div>
      <div className="ribbon-lbl">
        <span>Creation</span>
        <span className="ribbon-epoch">Epoch {epochNums(PLAN.days[currentDay-1])[0]} · {EPOCH_NAMES[epochNums(PLAN.days[currentDay-1])[0]]}</span>
        <span>Church Age</span>
      </div>
    </div>
  );
}

function DayView({day,done,currentDay,startDate,bibleVersion,onToggle,onNav,onToday,sealing}){
  const d=PLAN.days[day-1],epochs=epochNums(d);const e1=epochs[0]||1,e2=epochs[epochs.length-1]||e1,verses=d.verse_count,refs=d.readings;
  const date=addDays(startDate,day-1);const isDone=done.has(day);const isToday=day===currentDay;
  const epochLabel=e1===e2?("Epoch "+e1+" — "+EPOCH_NAMES[e1]):("Epoch "+e1+" → "+e2+" — crossing into "+EPOCH_NAMES[e2]);
  return (
    <section className="dayview">
      <div className="day-nav">
        <button className="nav-btn" onClick={()=>onNav(day-1)} disabled={day<=1}>‹</button>
        <div className="day-nav-mid">
          <div className="day-date">{fmtLong(date)}</div>
          <div className="day-sub">Day {day} · Week {Math.ceil(day/7)}{!isToday&&<button className="link-btn" onClick={onToday}>· back to today</button>}</div>
        </div>
        <button className="nav-btn" onClick={()=>onNav(day+1)} disabled={day>=365}>›</button>
      </div>
      <article className={"card "+(isDone?"card-done":"")}>
        <div className="card-epoch">
          <span className="epoch-num">{e1===e2?e1:(e1+"–"+e2)}</span>
          <div><div className="epoch-name">{epochLabel}</div><div className="epoch-era">{EPOCH_ERAS[e2]}</div></div>
        </div>
        <h2 className="reading-theme">{d.title}</h2>
        <p className="reading-context">{d.context}</p>
        <div className="load-row"><span>{d.chapter_count} chapter{d.chapter_count!==1?"s":""}</span><span className="load-dot">·</span><span>{verses} verses</span><span className="load-dot">·</span><span>{refs.length} reading{refs.length!==1?"s":""}</span></div>
        <ul className="refs">{refs.map((r,i)=>(<li key={r.segment_id} className="ref"><span className="ref-pg">READ {i+1}</span><span className="ref-txt">{r.reference}</span><a className="read-link" href={`https://www.biblegateway.com/passage/?search=${encodeURIComponent(r.reference)}&version=${encodeURIComponent(bibleVersion)}`} target="_blank" rel="noopener noreferrer">Open in {bibleVersion} ↗</a></li>))}</ul>
        <button className={"seal-btn "+(isDone?"seal-on ":"")+(sealing?"sealing":"")} onClick={()=>onToggle(day)}>
          {isDone?(<><SealMark/> Read · {fmtLong(date).split(",")[0]} sealed</>):"Mark today's reading complete"}
        </button>
        {isDone&&<div className="undo-hint">Tap again to unmark</div>}
      </article>
    </section>
  );
}

function WeekView({weekIdx,setWeekIdx,done,currentDay,startDate,onOpen,onToggle}){
  const first=weekIdx*7+1;const days=[];for(let n=first;n<first+7&&n<=365;n++)days.push(n);
  const wkDone=days.filter(n=>done.has(n)).length;
  return (
    <section>
      <div className="day-nav">
        <button className="nav-btn" onClick={()=>setWeekIdx(weekIdx-1)} disabled={weekIdx<=0}>‹</button>
        <div className="day-nav-mid"><div className="day-date">Week {weekIdx+1} of 53</div><div className="day-sub">{wkDone} of {days.length} readings done</div></div>
        <button className="nav-btn" onClick={()=>setWeekIdx(weekIdx+1)} disabled={weekIdx>=52}>›</button>
      </div>
      <div className="wk-list">{days.map(n=>{const d=PLAN.days[n-1];const date=addDays(startDate,n-1);const isDone=done.has(n);const isToday=n===currentDay;const refs=d.readings.map(r=>r.reference).join(" · ");
        return (<div key={n} className={"wk-row "+(isToday?"wk-today":"")}>
          <button className={"wk-check "+(isDone?"wk-check-on":"")} onClick={()=>onToggle(n)}>{isDone&&<SealMark small/>}</button>
          <button className="wk-body" onClick={()=>onOpen(n)}>
            <div className="wk-line1"><span className="wk-day">Day {n}</span><span className="wk-date">{DOW[date.getDay()]} {date.getDate()} {MONTHS[date.getMonth()].slice(0,3)}</span>{isToday&&<span className="wk-pill">today</span>}</div>
            <div className="wk-refs">{refs}</div>
          </button>
        </div>);
      })}</div>
    </section>
  );
}

function MonthView({cursor,setCursor,done,startDate,currentDay,today,onOpen}){
  const y=cursor.y,m=cursor.m;const firstOfMonth=new Date(y,m,1);const startOffset=firstOfMonth.getDay();const daysInMonth=new Date(y,m+1,0).getDate();
  const cells=[];for(let i=0;i<startOffset;i++)cells.push(null);for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const move=dir=>{const nm=m+dir;setCursor({y:y+Math.floor(nm/12),m:((nm%12)+12)%12});};
  const planEnd=addDays(startDate,364);
  const canBack=new Date(y,m,1)>new Date(startDate.getFullYear(),startDate.getMonth(),1);
  const canFwd=new Date(y,m,1)<new Date(planEnd.getFullYear(),planEnd.getMonth(),1);
  let monthDone=0,monthInPlan=0;
  for(let d=1;d<=daysInMonth;d++){const pn=diffDays(new Date(y,m,d),startDate)+1;if(pn>=1&&pn<=365){monthInPlan++;if(done.has(pn))monthDone++;}}
  return (
    <section>
      <div className="day-nav">
        <button className="nav-btn" onClick={()=>move(-1)} disabled={!canBack}>‹</button>
        <div className="day-nav-mid"><div className="day-date">{MONTHS[m]} {y}</div><div className="day-sub">{monthDone} of {monthInPlan} readings done</div></div>
        <button className="nav-btn" onClick={()=>move(1)} disabled={!canFwd}>›</button>
      </div>
      <div className="cal">
        {DOW.map(d=><div key={d} className="cal-dow">{d[0]}</div>)}
        {cells.map((d,i)=>{if(d===null)return <div key={"b"+i}/>;const date=new Date(y,m,d);const pn=diffDays(date,startDate)+1;const inPlan=pn>=1&&pn<=365;const isDone=inPlan&&done.has(pn);const isToday=diffDays(date,today)===0;const missed=inPlan&&!isDone&&pn<currentDay;
          return (<button key={d} className={["cal-cell",inPlan?"":"cal-out",isDone?"cal-done":"",isToday?"cal-today":"",missed?"cal-missed":""].join(" ")} disabled={!inPlan} onClick={()=>onOpen(pn)}>
            <span>{d}</span>{isDone&&<span className="cal-seal"/>}{missed&&<span className="cal-miss-dot"/>}
          </button>);
        })}
      </div>
      <div className="legend"><span><i className="lg lg-done"/> read</span><span><i className="lg lg-miss"/> to catch up</span><span><i className="lg lg-today"/> today</span></div>
    </section>
  );
}

function PlanView({done,doneCount,pace,streak,oldestUnread,start,bibleVersion,onBibleVersionChange,onJump,onStartChange,confirmReset,setConfirmReset,onReset,session,syncStatus,cloudBusy,cloudConfigured,onAuth,onSignOut}){
  const [email,setEmail]=useState("");const [password,setPassword]=useState("");
  const pct=Math.round((doneCount/365)*100);
  const paceTxt=pace===0?"On pace":pace>0?(pace+" day"+(pace>1?"s":"")+" ahead"):((-pace)+" day"+(pace<-1?"s":"")+" behind");
  return (
    <section className="plan">
      <div className="stat-grid">
        <Stat big={""+doneCount} lbl="days read"/>
        <Stat big={pct+"%"} lbl="of the Bible"/>
        <Stat big={""+streak} lbl="day streak"/>
        <Stat big={paceTxt} lbl="vs the calendar" tone={pace<0?"warn":"good"} small/>
      </div>
      {oldestUnread&&<button className="catchup" onClick={()=>onJump(oldestUnread)}><span className="catchup-lbl">Catch up</span><span>Oldest unread is Day {oldestUnread} — open it →</span></button>}
      <h2 className="sec-title">The nine epochs</h2>
      <div className="ep-list">{Object.keys(EPOCH_NAMES).map(k=>{const e=+k;const daysIn=PLAN.days.filter(d=>epochNums(d).includes(e));const first=daysIn[0].day;const doneIn=daysIn.filter(d=>done.has(d.day)).length;const p=Math.round((doneIn/daysIn.length)*100);
        return (<button key={e} className="ep-row" onClick={()=>onJump(first)}>
          <span className="ep-num">{e}</span>
          <span className="ep-mid"><span className="ep-name">{EPOCH_NAMES[e]}</span><span className="ep-era">{EPOCH_ERAS[e]} · {daysIn.length} days</span><span className="ep-bar"><span style={{width:p+"%"}}/></span></span>
          <span className="ep-pct">{p}%</span>
        </button>);
      })}</div>
      <h2 className="sec-title">Settings</h2>
      <div className="settings">
        <label className="set-row"><span>Day 1 of the plan</span><input type="date" value={start} onChange={e=>e.target.value&&onStartChange(e.target.value)}/></label>
        <div className="set-note">Set this to the day your group begins. Completed readings stay attached to their plan day if you re-anchor the start date.</div>
        <label className="set-row"><span>Bible version for links</span><select value={bibleVersion} onChange={e=>onBibleVersionChange(e.target.value)}>{VERSION_OPTIONS.map(v=><option key={v} value={v}>{v}</option>)}</select></label>
        <div className="set-note">The schedule stores only book-and-chapter references, so it can be opened in any listed translation without changing the chronological order.</div>
        {!confirmReset?<button className="danger-btn" onClick={()=>setConfirmReset(true)}>Reset all progress</button>:
        <div className="confirm-row"><span>Clear all {doneCount} completed days?</span><button className="danger-btn solid" onClick={onReset}>Yes, clear</button><button className="ghost-btn" onClick={()=>setConfirmReset(false)}>Keep</button></div>}
      </div>
      <h2 className="sec-title">Cloud sync</h2>
      <div className="settings cloud-card">
        {session?.user?<>
          <div className="cloud-user"><span className="cloud-dot"/><span><strong>{session.user.email}</strong><small>{syncStatus}</small></span></div>
          <div className="set-note">Completion, start date, and Bible-link preference now follow this account across devices. Offline changes are queued on this device.</div>
          <button className="ghost-btn" disabled={cloudBusy} onClick={onSignOut}>Sign out</button>
        </>:cloudConfigured?<>
          <div className="set-note">Sign in with the same account on each device to synchronise progress.</div>
          <label className="auth-field"><span>Email</span><input type="email" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com"/></label>
          <label className="auth-field"><span>Password</span><input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 6 characters"/></label>
          <div className="auth-actions"><button className="primary-btn" disabled={cloudBusy||!email||!password} onClick={()=>onAuth("signin",email,password)}>Sign in</button><button className="ghost-btn" disabled={cloudBusy||!email||!password} onClick={()=>onAuth("signup",email,password)}>Create account</button></div>
          <div className="set-note">Your existing device progress is imported the first time you connect an account.</div>
        </>:<div className="set-note">Cloud sync is not configured. Progress is still stored on this device.</div>}
      </div>
      <div className="colophon">NKJV Chronological Study Bible structure · 365 days · 1,189 complete chapters · 31,102 verses · reference-only, translation-neutral dataset</div>
    </section>
  );
}

      .set-row input,.set-row select{background:var(--ink);border:1px solid var(--line);color:var(--vellum);border-radius:8px;padding:7px 9px;font-family:inherit;color-scheme:dark;font-size:13px;}
      .set-note{font-size:11px;color:var(--faded);line-height:1.45;}
      .danger-btn{align-self:flex-start;border:1px solid rgba(176,106,68,.7);background:none;color:var(--clay);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;}
      .danger-btn.solid{background:var(--clay);color:var(--ink);border-color:transparent;}
      .ghost-btn{border:1px solid var(--line);background:none;color:var(--vellum);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;}
      .confirm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;}
      .cloud-card{gap:12px;}
      .cloud-user{display:flex;align-items:center;gap:9px;font-size:13px;}
      .cloud-user small{display:block;color:var(--faded);margin-top:2px;}
      .cloud-dot{width:9px;height:9px;border-radius:50%;background:#79a85b;box-shadow:0 0 0 3px rgba(121,168,91,.15);}
      .auth-field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--faded);}
      .auth-field input{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--vellum);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:13px;}
      .auth-actions{display:flex;gap:8px;flex-wrap:wrap;}
      .primary-btn{border:1px solid transparent;background:var(--gold);color:#211a07;border-radius:8px;padding:8px 13px;font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer;}
      button:disabled{opacity:.45;cursor:default;}
      .colophon{margin:20px 4px 8px;font-size:10.5px;color:var(--faded);text-align:center;line-height:1.5;}
      .tabs{flex-shrink:0;display:flex;background:rgba(22,29,20,.97);border-top:1px solid var(--line);padding:5px 4px calc(8px + env(safe-area-inset-bottom));position:sticky;bottom:0;}
      .tab{flex:1;border:0;background:none;color:var(--faded);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-size:10px;letter-spacing:.06em;padding:6px 0;cursor:pointer;border-radius:9px;}
      .tab-on{color:var(--gold);}
      .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--vellum);color:var(--ink);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:20;max-width:85%;text-align:center;}

      /* ── TABLET PORTRAIT: wider comfortable column ── */
      @media (min-width:700px){
        .main-inner{max-width:620px;padding-top:8px;}
        .hdr{padding:22px 28px 10px;}
        .hdr-title{font-size:34px;}
        .ref-txt{font-size:18px;}
      }

      /* ── TABLET LANDSCAPE / DESKTOP: sidebar layout ── */
      @media (min-width:1000px){
        .app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh;}
        .hdr{grid-column:1;grid-row:1;position:static;background:var(--ink);border-right:1px solid var(--line);padding:26px 22px 16px;}
        .hdr-top{flex-direction:column;align-items:flex-start;gap:14px;}
        .hdr-stat{text-align:left;}
        .tabs{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:8px 12px;align-items:stretch;background:var(--ink);}
        .tab{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 16px;font-size:14px;letter-spacing:.02em;border-radius:11px;}
        .tab svg{width:20px;height:20px;}
        .tab-on{background:var(--ink-2);}
        .main{grid-column:2;grid-row:1 / span 2;}
        .main-inner{max-width:760px;padding:24px 32px 40px;}
        .cal-cell{font-size:15px;border-radius:11px;}
        .ref-txt{font-size:19px;}
        .toast{bottom:32px;left:auto;right:32px;transform:none;}
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
